<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600&family=Newsreader:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body><main class="solo">
<h1>Change your login</h1>
{% if user.must_change %}<p>Before you continue, choose your own password. The starting password is not safe to keep.</p>{% endif %}
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form class="stack" method="post" action="{{ url_for('update_password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username<input name="username" value="{{ user.username }}" autocomplete="username" required></label>
  <label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
  <label>New password (at least 10 characters)<input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
  <label>Repeat new password<input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
  <button class="btn dark" type="submit">Save login</button>
  {% if not user.must_change %}<a href="{{ url_for('admin') }}">Cancel</a>{% endif %}
</form></main></body></html>
